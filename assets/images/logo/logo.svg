<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <style>
      .icon-main { fill: #0B1F33; }
      .icon-accent { fill: #C8A45D; }
      .text-primary { fill: #0B1F33; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 2px; }
      .text-secondary { fill: #667085; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 4px; }
    </style>
  </defs>
  <!-- Icon: Globe + Crest -->
  <g transform="translate(10, 15)">
    <!-- Base crest shape -->
    <path class="icon-main" d="M35,70 C15,50 5,30 5,10 L35,0 L65,10 C65,30 55,50 35,70 Z" opacity="0.1"/>
    <!-- Connecting lines / globe feel -->
    <path class="icon-accent" d="M15,20 L35,5 L55,20 L35,35 Z" />
    <path class="icon-main" d="M35,35 L55,20 L65,40 L35,55 Z" />
    <path class="icon-main" d="M15,20 L35,35 L35,55 L5,40 Z" opacity="0.8"/>
    <!-- Forward upward arrow element -->
    <path class="icon-accent" d="M25,50 L35,65 L55,35 L40,45 Z" />
  </g>
  <!-- Wordmark -->
  <text x="90" y="55" class="text-primary">GLOBE CREST</text>
  <text x="92" y="75" class="text-secondary">GROUP</text>
</svg>

